<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#17202a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;background:#f4f6f8;margin:0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:20px;overflow:hidden;box-shadow:0 18px 45px rgba(15,23,42,0.08);">
            <tr>
              <td style="padding:32px 32px 8px 32px;text-align:center;">
                <div style="display:inline-block;padding:10px 14px;border-radius:999px;background:#f7e8eb;color:#6b0f1a;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">
                  Account confirmation
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 0 32px;text-align:center;">
                <h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:800;color:#111827;">Confirm your email address</h1>
                <p style="margin:16px 0 0 0;font-size:16px;line-height:1.6;color:#4b5563;">
                  Welcome. Confirm <strong style="color:#111827;">{{ .Email }}</strong> to finish setting up your account.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px 8px 32px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6b0f1a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;line-height:1;border-radius:12px;padding:16px 24px;box-shadow:0 10px 20px rgba(107,15,26,0.22);">
                  Confirm email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;text-align:center;">
                  If the button does not work, copy and paste this link into your browser:
                </p>
                <p style="margin:10px 0 0 0;padding:14px;border-radius:12px;background:#f9fafb;border:1px solid #e5e7eb;font-size:12px;line-height:1.5;color:#374151;word-break:break-all;">
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 32px 32px;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;text-align:center;">
                  You can ignore this email if you did not create an account.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
